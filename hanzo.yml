# cal.hanzo.ai — the Booker SPA over Hanzo Base /v1/calendar.
#
# Gate only. The image for this repo is built and pushed by the native builder
# already in this repo (.hanzo/workflows/deploy.yml → ghcr.io/hanzoai/cal:<sha>);
# declaring `images:` here would push a second, differently-tagged copy of the
# same commit. What was missing is the assertion, so that is what this adds:
# the workspace installs against the committed lockfile and every package builds.
test:
  - name: build
    run: |
      set -euo pipefail
      pnpm install --frozen-lockfile
      pnpm build
