# cal.hanzo.ai — the Booker SPA over Hanzo Base /v1/calendar.
#
# One gate and one lane. The gate installs against the committed lockfile and
# builds; the site lane publishes app/dist to the Sites plane slug `cal-web`,
# which universe serves at cal.hanzo.ai (static-sites.yaml, cal-hanzo-ai-static)
# beside /v1/calendar on the Base backend. There is no image: nothing in the
# cluster runs this SPA.
test:
  - name: build
    run: |
      set -euo pipefail
      corepack enable
      pnpm install --frozen-lockfile
      pnpm build

site:
  slug: cal-web
  dir: app/dist
  build: corepack enable && pnpm install --frozen-lockfile && pnpm build
  on: [main]
