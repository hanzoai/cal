name: Platform Build (arcd executor)

# Native image build on a self-hosted arcd runner. Triggered via workflow_dispatch
# (by the `hanzo` CLI, a maintainer, or CD) — never by GHA on push, so pushing to
# GitHub burns zero GHA minutes. It builds and pushes the image to GHCR; rollout is
# handled separately by the operator via the App CR. The build muscle runs on arcd.

on:
  workflow_dispatch:
    inputs:
      target:
        description: "Build target, e.g. linux/amd64"
        required: true
      runner-pool:
        description: "arcd pool label, e.g. hanzo-build-linux-amd64"
        required: true
      image:
        description: "Fully-resolved image ref, e.g. ghcr.io/hanzoai/cal:v0.2.0"
        required: true
      dockerfile:
        description: Path to the Dockerfile
        required: true
        default: ./Dockerfile
      context:
        description: Build context
        required: true
        default: .
      push:
        description: Whether to push the built image
        required: true
        default: "true"

jobs:
  build:
    runs-on: ${{ inputs.runner-pool }}
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        if: ${{ inputs.push == 'true' }}
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ${{ inputs.context }}
          file: ${{ inputs.dockerfile }}
          push: ${{ inputs.push }}
          tags: ${{ inputs.image }}
          provenance: false
          # Cross-org private modules (hanzoai/*, luxfi/*) need authenticated git
          # in the builder stage — the Dockerfile mounts this as secret id
          # `gh_token` and configs `url.insteadOf` before `go mod download`.
          # Without it the build fails SECURITY ERROR on force-moved luxfi tags.
          secrets: |
            gh_token=${{ secrets.GH_PAT }}
